<ion-content class="page-shell" [fullscreen]="true">
  <div class="device-shell" [class.android-mode]="platform === 'android'" [class.dark-mode]="darkMode">
    <div class="platform-switcher">
      <ion-segment [value]="platform" mode="ios" (ionChange)="onPlatformChange($event)">
        <ion-segment-button value="ios">
          <ion-label>iOS</ion-label>
        </ion-segment-button>
        <ion-segment-button value="android">
          <ion-label>Android</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="doc-panel">
      <h1>Ionic Framework</h1>

      <ion-item lines="full" class="toggle-row">
        <ion-icon name="moon-outline" slot="start" class="item-icon-static"></ion-icon>
        <ion-label>Dark Mode</ion-label>
        <ion-toggle
          slot="end"
          [checked]="darkMode"
          aria-label="Dark mode toggle"
          (ionChange)="onDarkModeChange($event)">
        </ion-toggle>
      </ion-item>

      <ion-list class="component-list">
        <ion-item *ngFor="let item of components" lines="full" class="component-item">
          <div class="component-badge" slot="start">
            <ion-icon [name]="item.icon"></ion-icon>
          </div>
          <ion-label>{{ item.name }}</ion-label>
          <ion-icon name="chevron-forward" slot="end" class="arrow-icon"></ion-icon>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
